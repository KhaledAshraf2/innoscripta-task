services:
  web:
    build:
      context: .
      args:
        # Read from your shell or a local .env file next to this compose file.
        VITE_NEWS_API_KEY: ${VITE_NEWS_API_KEY:-}
        VITE_GUARDIAN_API_KEY: ${VITE_GUARDIAN_API_KEY:-}
        VITE_NYT_API_KEY: ${VITE_NYT_API_KEY:-}
    ports:
      - '8080:80'
    restart: unless-stopped
