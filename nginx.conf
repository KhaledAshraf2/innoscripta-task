server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed assets are immutable; the entry HTML must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # NewsAPI rejects browser requests from other origins, so the same path the
    # Vite dev server proxies is mirrored here.
    location /proxy/newsapi/ {
        proxy_pass https://newsapi.org/;
        proxy_set_header Host newsapi.org;
        proxy_ssl_server_name on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
